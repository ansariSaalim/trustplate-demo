<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Clickable phone preview of the TrustPlate app. Sample data only.">
<meta name="robots" content="noindex">
<meta property="og:title" content="TrustPlate: phone app preview">
<meta property="og:description" content="Clickable phone preview of the TrustPlate app. Sample data only.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2346e8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustPlate Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the TrustPlate web app shown at phone size inside a device frame, with a guide panel beside it on wide screens; on a real phone the app fills the screen */
:root {
  --page: #eef0f6;
  --panel: #ffffff;
  --panel-2: #f4f5f9;
  --ink: #11162a;
  --muted: #687089;
  --line: #e3e6ee;
  --brand: #2346e8;
  --brand-fill: #2346e8;
  --brand-soft: #e9edff;
  --on-brand: #ffffff;
  --sun: #ffc233;
  --on-sun: #2b1d00;
  --screen: #ffffff;
  --bezel: #0b0d14;
  --lv-certified: #2346e8;
  --lv-checked: #0f8a6e;
  --lv-owner: #4b5468;
  --lv-community: #7146d4;
  --shadow: 0 30px 80px rgba(17, 22, 42, 0.25);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --k: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #06080f; --panel: #10141f; --panel-2: #0c1019; --ink: #eef1f8; --muted: #9aa3ba; --line: #232a3d;
    --brand: #8296ff; --brand-fill: #4a62f2; --brand-soft: #1b2350; --screen: #10141f; --bezel: #000000;
    --lv-certified: #3a55e6; --shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #06080f; --panel: #10141f; --panel-2: #0c1019; --ink: #eef1f8; --muted: #9aa3ba; --line: #232a3d;
  --brand: #8296ff; --brand-fill: #4a62f2; --brand-soft: #1b2350; --screen: #10141f; --bezel: #000000;
  --lv-certified: #3a55e6; --shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.stage { min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 20px 24px; }
.phone-wrap { flex: none; width: calc(414px * var(--k)); height: calc(868px * var(--k)); }
.phone { width: 414px; height: 868px; transform: scale(var(--k)); transform-origin: top left; border-radius: 62px; background: var(--bezel); padding: 12px; box-shadow: var(--shadow), inset 0 0 0 2px #2a2f3d; }
.screen { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: var(--screen); }
.status { position: relative; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 36px; font-weight: 700; font-size: 15px; background: var(--screen); color: var(--ink); }
.island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 118px; height: 32px; border-radius: 20px; background: #000000; }
.st-icons { display: flex; align-items: center; gap: 6px; }
.st-icons svg { display: block; }
iframe { display: block; width: 390px; height: 800px; border: 0; background: var(--screen); }
.side { width: min(440px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; display: grid; gap: 16px; align-content: start; padding: 4px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo-mark { width: 44px; height: 44px; border-radius: 14px; background: var(--brand-fill); color: var(--on-brand); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(35, 70, 232, 0.3); }
.brand b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.brand b span { color: var(--brand); }
.brand small { color: var(--muted); font-weight: 700; font-size: 13px; }
.lead { margin: 0; color: var(--muted); }
.lead a { color: var(--brand); font-weight: 700; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 10px; }
.box-h { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 800; }
.tag { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--sun); color: var(--on-sun); }
.seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 11px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.small { margin: 0; font-size: 12.5px; color: var(--muted); }
.go { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; font-size: 15px; background: var(--brand-fill); color: var(--on-brand); box-shadow: 0 10px 22px rgba(35, 70, 232, 0.28); }
.go-row { display: flex; gap: 8px; }
.go-row .go { flex: 1; }
.end { border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.reset { justify-self: start; border: 1.5px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; }
.flow-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 7px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.step:hover { background: var(--panel-2); }
.step .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 800; }
.step small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; line-height: 1.35; margin-top: 1px; }
.step[aria-current="step"] { background: var(--brand-soft); }
.step[aria-current="step"] .n { background: var(--brand-fill); color: var(--on-brand); }
.lv { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; color: var(--muted); }
.lv i { width: 12px; height: 12px; border-radius: 4px; margin-top: 4px; }
.lv b { color: var(--ink); }
@media (max-width: 980px) {
  .stage { flex-direction: column; gap: 24px; padding-block: 24px 40px; }
  .side { max-height: none; overflow: visible; }
}
/* On a real phone, skip the frame: the app fills the screen */
@media (max-width: 560px) {
  .stage { display: block; padding: 0; min-height: 0; }
  .phone-wrap { width: 100%; height: 100dvh; }
  .phone { width: 100%; height: 100%; transform: none; border-radius: 0; padding: 0; box-shadow: none; background: var(--screen); }
  .screen { width: 100%; height: 100%; border-radius: 0; }
  .status { display: none; }
  iframe { width: 100%; height: 100%; }
  .side { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="island"></span>
          <span class="st-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.75" y="0.75" width="22" height="10.5" rx="3" stroke="currentColor" stroke-width="1.5" opacity="0.5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.6" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="currentColor" opacity="0.5"/></svg>
          </span>
        </div>
        <iframe id="app" title="TrustPlate app, phone size" src="../index.html#embed"></iframe>
      </div>
    </div>
  </div>
  <aside class="side" id="side" aria-label="Demo guide"></aside>
</div>

<script>
// The app inside the frame owns the guided tour; this panel starts it, lists its steps and switches role.
const WEB_LINK = '../';
const ROLES = [['diner', 'Diner'], ['owner', 'Restaurant owner'], ['admin', 'Our team']];
const LEVELS = [
  ['var(--lv-certified)', 'Certified', 'valid certificate, checked by us, expiry tracked'],
  ['var(--lv-checked)', 'Checked by us', 'our team visited the kitchen'],
  ['var(--lv-owner)', 'Owner-declared', "the owner's word, not checked yet"],
  ['var(--lv-community)', 'Community', 'added or confirmed by trusted communities'],
];
const frame = document.getElementById('app');
const side = document.getElementById('side');
let state = { role: 'diner', guide: null, steps: [] };
const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const actions = [];
function send(action) {
  try { frame.contentWindow.postMessage({ tp: 'trustplate', action }, '*'); } catch (e) { /* frame not ready yet */ }
}
function render() {
  actions.length = 0;
  const act = (a) => actions.push(a) - 1;
  const g = state.guide;
  const roles = ROLES.map(([id, label]) => '<button data-a="' + act({ type: 'role', role: id }) + '" aria-pressed="' + (state.role === id) + '">' + esc(label) + '</button>').join('');
  const chapters = [];
  state.steps.forEach((st, i) => {
    let ch = chapters[chapters.length - 1];
    if (!ch || ch.c !== st.c) { ch = { c: st.c, items: [] }; chapters.push(ch); }
    ch.items.push([st, i]);
  });
  const steps = chapters.map((ch) => '<section class="box"><h2 class="box-h">' + esc(ch.c) + '</h2><ol class="steps">' + ch.items.map(([st, i]) =>
    '<li><button class="step" data-a="' + act({ type: 'guide', step: i }) + '"' + (g === i ? ' aria-current="step"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + esc(st.t) + '</span></button></li>').join('') + '</ol></section>').join('');
  const levels = LEVELS.map(([c, t, d]) => '<div class="lv"><i style="background:' + c + '"></i><span><b>' + esc(t) + '</b>: ' + esc(d) + '</span></div>').join('');
  const tour = g === null
    ? '<button class="go" data-a="' + act({ type: 'guide', step: 0 }) + '">Start the guided tour</button>'
    : '<div class="go-row"><button class="go" data-a="' + act({ type: 'guide', step: Math.min(g + 1, state.steps.length - 1) }) + '">Next step</button><button class="end" data-a="' + act({ type: 'guideEnd' }) + '">End tour</button></div>';
  side.innerHTML =
    '<div class="brand"><span class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.6c0 4.4-3.1 8.2-7.5 9.4-4.4-1.2-7.5-5-7.5-9.4V6z"/><path d="M8.8 12.2l2.3 2.3 4.3-4.6"/></svg></span><div><b>Trust<span>Plate</span></b><small>Phone app preview · sample data</small></div></div>' +
    '<p class="lead">The TrustPlate app at phone size: the same app as the <a href="' + esc(WEB_LINK) + '" target="_blank" rel="noopener">web version</a>. The guided tour walks through every screen with Next and Back, inside the phone.</p>' +
    '<section class="box"><h2 class="box-h">Guided tour' + (g === null ? '' : ' <span class="tag">Step ' + (g + 1) + ' of ' + state.steps.length + '</span>') + '</h2>' + tour + '</section>' +
    '<section class="box"><h2 class="box-h">View as <span class="tag">Demo only</span></h2><div class="seg" role="group" aria-label="View as (demo only)">' + roles + '</div>' +
    '<p class="small">The live app has no switch: restaurant owners sign in to their own portal, and our team\'s panel is private, behind staff accounts and two-step sign-in.</p>' +
    '<button class="reset" data-a="' + act({ type: 'reset' }) + '">Reset demo</button></section>' +
    (steps || '<p class="small">Loading the steps…</p>') +
    '<section class="box"><h2 class="box-h">Trust levels, strongest first</h2>' + levels + '</section>';
}
side.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (b) send(actions[Number(b.getAttribute('data-a'))]);
});
window.addEventListener('message', (e) => {
  const m = e.data;
  if (e.source !== frame.contentWindow || !m || m.tp !== 'trustplate-state') return;
  state = { role: m.role, guide: typeof m.guide === 'number' ? m.guide : null, steps: Array.isArray(m.steps) ? m.steps : state.steps };
  render();
});
function fit() {
  const k = Math.min(1, (window.innerHeight - 40) / 868, (window.innerWidth - 32) / 414);
  document.documentElement.style.setProperty('--k', String(Math.max(0.5, k)));
}
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
